plugins {
    id 'com.android.application'
}

// The phone app is the agent server's question-bank console, SERVER_URL/crm: the
// same page a browser gets. No API key is in the APK; the server keeps them.
//
// Settings come from android/.env. Only APP_NAME and SERVER_URL are read; the
// server's .env with the API keys is never touched by this build. A Gradle
// property overrides the file for one build, e.g. a side-by-side test copy:
//   gradlew assembleRelease -PtestSuffix=.localtest -PserverUrl=http://localhost:5000
def ENV_KEYS_FOR_APK = ['APP_NAME', 'SERVER_URL']
def dotenv = [:]
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.eachLine('UTF-8') { line ->
        def m = line =~ /^\s*([A-Z_]+)\s*=\s*(.*?)\s*$/
        if (m.matches() && ENV_KEYS_FOR_APK.contains(m.group(1))) dotenv[m.group(1)] = m.group(2)
    }
}
def setting = { String key, String prop, String fallback ->
    (project.findProperty(prop) ?: System.getenv(key) ?: dotenv[key] ?: fallback).toString().trim()
}

def appName = setting('APP_NAME', 'appName', 'MRPscan Agent')
def serverUrl = setting('SERVER_URL', 'serverUrl', 'https://voice.amitaash.com').replaceAll('/+$', '')
if (!(serverUrl ==~ /^https?:\/\/[^\/\s]+$/)) {
    throw new GradleException("SERVER_URL must look like https://voice.example.com (got '${serverUrl}')")
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.itsolution.mrpscanagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.itsolution.mrpscanagent'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl + '"'
        // chrome://inspect for test copies only; the real app's pages cannot be inspected.
        buildConfigField 'boolean', 'WEB_DEBUG', project.hasProperty('testSuffix') ? 'true' : 'false'
        resValue 'string', 'app_name', appName
        if (project.hasProperty('testSuffix')) applicationIdSuffix project.property('testSuffix')
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystoreProps.getProperty('storeFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
